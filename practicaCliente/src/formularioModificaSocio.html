<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modificar socio</title>
  <link rel="stylesheet" href="./css/style.css">
  <script src="./script/modificaSocio.js" defer></script>
</head>
<body>
  <main class="mainPrincipal">
    <section class="card">
      <h2>Modificar Socio</h2>

      <form id="form-modifica" novalidate>
        <label class="ficha-label" for="mod-id">ID:</label>
        <input class="ficha-input" type="text" id="mod-id" readonly>

        <label class="ficha-label" for="mod-dni">DNI:</label>
        <input class="ficha-input" type="text" id="mod-dni" readonly>

        <label class="ficha-label" for="mod-nombre">Nombre:</label>
        <input class="ficha-input" type="text" id="mod-nombre">

        <label class="ficha-label" for="mod-apellidos">Apellidos:</label>
        <input class="ficha-input" type="text" id="mod-apellidos">

        <label class="ficha-label" for="mod-email">Email:</label>
        <input class="ficha-input" type="email" id="mod-email">

        <label class="ficha-label" for="mod-telefono">Teléfono:</label>
        <input class="ficha-input" type="tel" id="mod-telefono">

        <label class="ficha-label" for="mod-fecha-nacimiento">Fecha de nacimiento:</label>
        <input class="ficha-input" type="date" id="mod-fecha-nacimiento">

        <label class="ficha-label" for="mod-fecha-alta">Fecha de alta:</label>
        <input class="ficha-input" type="text" id="mod-fecha-alta" readonly>

        <label class="ficha-label" for="mod-cuota">Cuota mensual (€):</label>
        <input class="ficha-input" type="number" id="mod-cuota" min="0" step="0.01">

        <label class="ficha-label">Actividades:</label>
        <div class="checkbox-grid">
          <label><input type="checkbox" name="actividades" value="natación"> Natación</label>
          <label><input type="checkbox" name="actividades" value="yoga"> Yoga</label>
          <label><input type="checkbox" name="actividades" value="pádel"> Pádel</label>
          <label><input type="checkbox" name="actividades" value="musculación"> Musculación</label>
          <label><input type="checkbox" name="actividades" value="spinning"> Spinning</label>
          <label><input type="checkbox" name="actividades" value="pilates"> Pilates</label>
        </div>

        <div id="mod-mensajes">
            
        </div>
        <br>
        <button type="button" class="btn btn-success btn-block" id="mod-guardar">Guardar cambios</button>
        <br>
        <button type="button" class="btn btn-secondary btn-block" id="mod-cancelar">Cancelar</button>
      </form>
    </section>
  </main>
</body>
</html>
